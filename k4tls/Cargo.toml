[package]
name = "k4tls"
version = "0.1.0"
edition = "2021"
description = "Kindle 4 weread TLS 传输组件：rustls 静态库（C ABI + LuaJIT FFI），替换 LuaSec/OpenSSL"
license = "MIT"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rustls-pki-types = "1"
libc = { version = "0.2", default-features = false }

[dev-dependencies]
rcgen = "0.13"

[lib]
name = "k4tls"
path = "src/lib.rs"
# cdylib → libk4tls.so（KOReader LuaJIT FFI 加载）；rlib → bench CLI 与测试复用
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "k4tls-bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# 不设 panic="abort"：FFI 边界 catch_unwind 兜底返回 -99，不拖死宿主 KOReader。
